name: OCI image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build image
        run: nix build .#openai-oauth-image --no-link --print-out-paths > image-path
      - name: Resolve image tags
        id: image_tags
        shell: bash
        run: |
          source_version="v$(node -p 'require("./packages/openai-oauth/package.json").version')"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          else
            tag="latest"
          fi
          echo "source_version=$source_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Load and tag image
        run: |
          podman load --input "$(cat image-path)"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          source_version="${{ steps.image_tags.outputs.source_version }}"
          tag="${{ steps.image_tags.outputs.tag }}"
          podman tag "localhost/openai-oauth:$source_version" "$image:$tag"
      - name: Smoke test image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${{ steps.image_tags.outputs.tag }}"
          podman run --rm "$image:$tag" --help | grep -q 'Free OpenAI API access'
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${{ steps.image_tags.outputs.tag }}"
          podman push "$image:$tag"
