name: OCI image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build image
        run: nix build .#openai-oauth-image --no-link --print-out-paths > image-path
      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
            [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          else
            version="v2.0.0"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME}"
            [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          else
            version="v2.0.0"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Load and tag image
        run: |
          podman load --input "$(cat image-path)"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${{ steps.tags.outputs.version }}"
          podman tag localhost/openai-oauth:v2.0.0 "$image:$version"
      - name: Smoke test image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${{ steps.tags.outputs.version }}"
          podman run --rm "$image:$version" --help | grep -q 'Free OpenAI API access'
      - name: Push image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${{ steps.tags.outputs.version }}"
          podman push "$image:$version"
