name: OCI image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build image
        run: nix build .#openai-oauth-image --no-link --print-out-paths > image-path
      - name: Resolve image tags
        id: image_tags
        shell: bash
        run: |
          source_version="v$(node -p 'require("./packages/openai-oauth/package.json").version')"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          else
            tag="latest"
          fi
          echo "source_version=$source_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Load and tag image
        run: |
          podman load --input "$(cat image-path)"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          source_version="${{ steps.image_tags.outputs.source_version }}"
          tag="${{ steps.image_tags.outputs.tag }}"
          podman tag "localhost/openai-oauth:$source_version" "$image:$tag"
      - name: Smoke test image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${{ steps.image_tags.outputs.tag }}"
          podman run --rm --log-driver=k8s-file --log-opt=max-size=10mb \
            "$image:$tag" --help | grep -q 'Free OpenAI API access'
          podman image inspect --format '{{.Config.Cmd}}' "$image:$tag" | grep -q -- '--device-auth'
          podman image inspect "$image:$tag" --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep -Fxq 'CODEX_OPENAI_SERVER_LOG_TOKEN_REFRESH=1'
          smoke_name="openai-oauth-login-ui-smoke"
          smoke_token="0123456789abcdef0123456789abcdef"
          cleanup() { podman rm --force "$smoke_name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          podman run --detach --name "$smoke_name" --network=none \
            --env OPENAI_OAUTH_LOGIN_UI=1 \
            --env OPENAI_OAUTH_CONTROL_TOKEN="$smoke_token" \
            --env OPENAI_OAUTH_CONTROL_HOST=127.0.0.1 \
            --env OPENAI_OAUTH_CONTROL_PORT=10532 \
            --env LOGIN_UI_HOST=127.0.0.1 \
            --env LOGIN_UI_PORT=10533 \
            --env LOGIN_UI_PUBLIC_ORIGIN=http://127.0.0.1:10533 \
            "$image:$tag" --device-auth --host 127.0.0.1 --port 10531
          ready=0
          for attempt in {1..30}; do
            if podman exec "$smoke_name" bun -e 'Promise.all([fetch("http://127.0.0.1:10533/"), fetch("http://127.0.0.1:10533/assets/styles.css")]).then(async ([page, styles]) => { const html = await page.text(); const css = await styles.text(); if (!page.ok || !html.includes("No credentials are configured yet.") || !styles.ok || css.length === 0) process.exit(1); }).catch(() => process.exit(1))'; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            podman logs "$smoke_name"
            exit 1
          fi
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${{ steps.image_tags.outputs.tag }}"
          podman push "$image:$tag"
